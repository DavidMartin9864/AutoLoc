<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AutoLoc - Inscription</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css/inscriptionbootstrap.css">
  <link rel="icon" type="image/png" href="Images/Favicon.ico">
</head>

<body>

  <!-- ======== HEADER ======== -->
  <header class="site-header" role="banner">
    <div class="header-inner container-fluid d-flex justify-content-between align-items-center px-5">
    <div class="header-left d-flex align-items-center gap-3">
        <a class="logo d-flex align-items-center" href="index.html" aria-label="AutoLoc - accueil">
          <img src="Images/Logo.png" alt="Logo AutoLoc" class="logo-img me-3">
        </a>
      </div>

      <div class="header-center flex-fill d-flex justify-content-center">
        <a href="index.html" class="logo text-decoration-none text-white">
          <h1 class="site-title m-0">AutoLoc</h1>
        </a>
      </div>

      <div class="header-right d-flex align-items-center">
        <nav class="stacked-btn d-flex flex-column" role="navigation" aria-label="actions utilisateur">
          <button type="button" class="btn btn-auth mb-2" onclick="window.location.href='inscription.html'" id="btn-auth">Connexion / Inscription</button>
          <button type="button" class="btn btn-res" id="btn-res">Gérer mes réservations</button>
        </nav>
      </div>
    </div>
  </header>

  <!-- ======== MAIN ======== -->
  <main class="d-flex justify-content-center align-items-center py-5">
    <section class="form-section text-center w-100">
      <div class="container">
        <h2 class="mb-4">Créer un compte AutoLoc</h2>

        <form class="signup-form" aria-label="Formulaire d'inscription" onsubmit="event.preventDefault();">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="nom" class="form-label">Nom</label>
              <input type="text" id="nom" name="nom" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label for="prenom" class="form-label">Prénom</label>
              <input type="text" id="prenom" name="prenom" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label for="naissance" class="form-label">Date de naissance</label>
              <input type="date" id="naissance" name="naissance" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label for="permis" class="form-label">Date d’obtention du permis</label>
              <input type="date" id="permis" name="permis" class="form-control" required>
            </div>

            <div class="col-12">
              <label for="adresse" class="form-label">Adresse postale</label>
              <input type="text" id="adresse" name="adresse" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">Adresse mail</label>
              <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label for="telephone" class="form-label">Numéro de téléphone</label>
              <input type="tel" id="telephone" name="telephone" class="form-control" pattern="[0-9]{10}" required>
            </div>

            <div class="col-md-6">
              <label for="password" class="form-label">Mot de passe</label>
              <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label for="confirm-password" class="form-label">Confirmation du mot de passe</label>
              <input type="password" id="confirm-password" name="confirm-password" class="form-control" required>
            </div>
          </div>

          <div class="d-flex justify-content-center gap-3 mt-4">
            <button type="submit" class="submit-btn">Créer mon compte</button>
            <button type="button" class="submit-btn secondary">Se connecter</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- ======== FOOTER ======== -->

  <footer class="site-footer">
    <div class="footer-inner d-flex justify-content-between align-items-center w-100 px-5">
      <img src="Images/Logo.png" alt="Logo" class="logo-img">
      <div class="footer-columns">

        <div class="row">
          <button class="col footer-btn">À propos</button>
          <button class="col footer-btn">Qui sommes-nous</button>
          <button class="col footer-btn">Espace presse</button>
          <button class="col footer-btn">Nos valeurs</button>
      </div>

        <div class="row" >
          <button class="col footer-btn">Nous contacter</button>
          <button class="col footer-btn">Téléphone</button>
          <button class="col footer-btn">Mail</button>
          <button class="col footer-btn">Réseaux sociaux</button>
        </div>

      </div>
    </div>
</footer>

</body>
</html>
