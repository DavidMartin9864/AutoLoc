<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AutoLoc - Location de voiture</title>
  <link rel="icon" type="image/png" href="Images/Favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css/indexbootstrap.css">
</head>

<body>

  <!-- ======== HEADER ======== -->
  <header class="site-header" role="banner">
    <div class="header-inner container-fluid d-flex justify-content-between align-items-center px-5">
    <div class="header-left d-flex align-items-center gap-3">
        <a class="logo d-flex align-items-center" href="index.html" aria-label="AutoLoc - accueil">
          <img src="Images/Logo.png" alt="Logo AutoLoc" class="logo-img me-3">
        </a>
      </div>

      <div class="header-center flex-fill d-flex justify-content-center">
        <a href="index.html" class="logo text-decoration-none text-white">
          <h1 class="site-title m-0">AutoLoc</h1>
        </a>
      </div>

      <div class="header-right d-flex align-items-center">
        <nav class="stacked-btn d-flex flex-column" role="navigation" aria-label="actions utilisateur">
          <button type="button" class="btn btn-auth mb-2" onclick="window.location.href='inscription.html'" id="btn-auth">Connexion / Inscription</button>
          <button type="button" class="btn btn-res" id="btn-res">Gérer mes réservations</button>
        </nav>
      </div>
    </div>
  </header>

  <!-- ======== MAIN ======== -->
  <main class="py-4">
    <div class="container">

      <!-- ======== Barre de recherche ======== -->
      <form class="search-bar" id="searchForm" aria-label="Recherche de véhicule"
        onsubmit="event.preventDefault(); performSearch();">

        <div class="row g-3 align-items-end">

          <!-- recherche texte -->
          <div class="col-12 col-md-4">
            <label for="q" class="form-label">Rechercher un véhicule</label>
            <input id="q" name="q" class="form-control search-input" placeholder="ex : Clio, Model 3, 3008" />
          </div>

          <!-- dates -->
          <div class="col-12 col-md-4">
            <div class="row g-2">
              <div class="col-6">
                <label for="start" class="form-label">Début de réservation</label>
                <input type="datetime-local" id="start" name="start" class="form-control datetime-select">
              </div>
              <div class="col-6">
                <label for="end" class="form-label">Fin de réservation</label>
                <input type="datetime-local" id="end" name="end" class="form-control datetime-select">
              </div>
            </div>
          </div>

          <!-- filtres -->
          <div class="col-12 col-md-4">
            <div class="row g-2">
              <div class="col-6 col-lg-3">
                <label for="marque" class="form-label">Marque</label>
                <select id="marque" class="form-select filter-select" name="type">
                  <option value="toutes">Toutes</option>
                  <option value="renault">Renault</option>
                  <option value="citroen">Citroën</option>
                  <option value="volkswagen">Volkswagen</option>
                  <option value="bmw">BMW</option>
                  <option value="peugeot">Peugeot</option>
                  <option value="tesla">Tesla</option>
                  <option value="audi">Audi</option>
                </select>
              </div>

              <div class="col-6 col-lg-3">
                <label for="price" class="form-label">Prix</label>
                <select id="price" class="form-select filter-select" name="price">
                  <option value="all">Tous</option>
                  <option value="lt500">&lt;60€/j</option>
                  <option value="500-1000">60-100€/j</option>
                  <option value="gt1000">&gt;100€/j</option>
                </select>
              </div>

              <div class="col-6 col-lg-3">
                <label for="fuel" class="form-label">Carburant</label>
                <select id="fuel" class="form-select filter-select" name="fuel">
                  <option value="any">Tous</option>
                  <option value="essence">Essence</option>
                  <option value="diesel">Diesel</option>
                  <option value="electrique">Électrique</option>
                  <option value="hybride">Hybride</option>
                </select>
              </div>

              <div class="col-6 col-lg-3">
                <label for="seats" class="form-label">Places</label>
                <select id="seats" class="form-select filter-select" name="seats">
                  <option value="any">Toutes</option>
                  <option value="2">2</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="7">7+</option>
                </select>
              </div>
            </div>
          </div>

          <div class="col-12 d-flex justify-content-end">
            <button type="submit" class="btn search-submit" aria-label="Valider la recherche">Voir les disponibilités</button>
          </div>
        </div>
      </form>
